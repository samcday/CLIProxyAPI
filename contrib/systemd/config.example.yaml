# Minimal config for a single-user, loopback-only CLIProxyAPI.
# Copy to ~/.config/cliproxyapi/config.yaml unchanged. The wrapper substitutes
# each @PLACEHOLDER@ from a key file in ~/.config/cliproxyapi at startup (see
# README.md), so this file holds no secrets.
config-version: 8

server:
  host: "127.0.0.1"
  port: 8317
  # Skips the request-logging middleware, so request/response bodies (including
  # error dumps) are never written to disk.
  commercial-mode: true
  discovery:
    enabled: false

management:
  allow-remote: false
  # Empty disables the Management API entirely.
  secret-key: ""
  disable-control-panel: true

access:
  # Authenticates local clients to the proxy; not an upstream provider key.
  api-keys:
    - "@CLIENT_API_KEY@"

upstream:
  claude:
    # By default the Anthropic model list disguises every non-Claude model ID
    # as claude-fable-5-dd-<id reversed>, so a Claude-only client can still
    # select it. Local clients accept any ID, so list the real IDs instead.
    disable-cloaking-model-list: true

# Upstream provider API keys. Delete a group to stop using that provider; its
# key file is only needed while the group is present.
api-keys:
  # Xiaomi MiMo Token Plan over its Anthropic-compatible endpoint, served by the
  # Claude executor. The models list is required: without it this key would
  # advertise, and be selected for, the whole Claude catalog.
  claude:
    - name: mimo
      # Token Plan keys are bound to the cluster that issued them (sgp or cn).
      # Use the Base URL shown on the Token Plan page, with /anthropic appended.
      base-url: "https://token-plan-sgp.xiaomimimo.com/anthropic"
      models:
        - name: "mimo-v2.6-pro"
          # Keep thinking blocks verbatim and replay reasoning the client
          # dropped; MiMo rejects multi-turn tool calls without it.
          is-compat: true
        - name: "mimo-v2.6-pro[1m]" # MiMo's 1M-context variant, passed through as-is
          is-compat: true
        - name: "mimo-v2.6-flash"
          is-compat: true
      keys:
        - api-key: "@MIMO_API_KEY@"

oauth:
  auth-dir: "~/.local/share/cliproxyapi/auth"
  model-alias:
    claude:
      # Some clients still request this retired model ID for background work
      # (titles, summaries). Route it to a current Haiku model.
      - name: "claude-haiku-5-5"
        alias: "claude-3-5-haiku-20241022"
        fork: true

observability:
  logs:
    debug: false
    logging-to-file: false
    request-log: false
  usage:
    usage-statistics-enabled: false
  pprof:
    enable: false

plugins:
  enabled: false
